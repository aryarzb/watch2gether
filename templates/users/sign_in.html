{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | Watch2Gether</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">

</head>


<body>

<div class="auth-page">

    <div class="auth-card signin-card">

        <a href="/" class="logo">
            Watch<span>2</span>Gether
        </a>


        <div class="auth-heading">

            <h1>Welcome back</h1>

            <p>
                Sign in to continue discovering movies.
            </p>

        </div>


        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="auth-button">
                Sign in
            </button>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create one
            </a>

        </p>

    </div>

</div>

</body>

</html>
